{{ with .Site.Params.projects }}{{ if .enable }}
<section id="projects" class="section">
  <div class="section__inner">
    <div class="section__header">
      <span class="section__num mono">05</span>
      <h2 class="section__title">{{ .title | default "Projects" }}</h2>
      <div class="section__line"></div>
    </div>

    <div class="projects__grid">
      {{ range $i, $p := .items }}
      <div class="reveal project-card-wrap" style="transition-delay: {{ mul $i 100 }}ms">
        <article class="project-card" data-hover>
          <div class="project-card__img-wrap">
            {{ with $p.image }}<img class="project-card__img" src="{{ . | relURL }}" alt="{{ $p.title }}" />{{ end }}
            <div class="project-card__img-overlay"></div>
          </div>
          <div class="project-card__body">
            <h3 class="project-card__title">{{ $p.title }}</h3>
            <p class="project-card__desc">{{ $p.content | markdownify }}</p>
            <div class="project-card__footer">
              <div class="project-card__tags">
                {{ range $p.badges }}<span class="stack-badge">{{ . }}</span>{{ end }}
              </div>
              {{ range $p.links }}
                <a class="project-card__link" data-hover href="{{ .url }}" target="_blank" rel="noopener" aria-label="External link">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
              {{ end }}
            </div>
          </div>
        </article>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}{{ end }}
